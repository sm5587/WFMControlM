version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: wfm-controlm-backend:prod
    container_name: wfm-controlm-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "true"
      NODE_ENV: production
      PORT: "4000"
    ports:
      - "4000:4000"
    volumes:
      - backend_logs:/app/logs
      - backend_prisma:/app/prisma
      - ./config/lib:/config/lib:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: wfm-controlm-frontend:prod
    container_name: wfm-controlm-ui
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - app_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: wfm-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app_net

volumes:
  backend_logs:
  backend_prisma:

networks:
  app_net:
    driver: bridge
