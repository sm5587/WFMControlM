# Production frontend + API reverse proxy.
# TLS/HTTPS: terminate SSL at nginx or an upstream load balancer, then:
#   1. Set Admin → Config: infra.trustProxy=true, infra.requireHttps=true
#   2. Uncomment and configure the listen 443 ssl block below (cert paths from your PKI team)
#
# Example TLS server block (replace cert paths):
# server {
#     listen 443 ssl http2;
#     server_name wfmwatch.example.com;
#     ssl_certificate     /etc/ssl/certs/wfmwatch.crt;
#     ssl_certificate_key /etc/ssl/private/wfmwatch.key;
#     include             /etc/nginx/conf.d/wfm-controlm.conf;  # reuse location blocks
# }

upstream backend_upstream {
    server backend:4005;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic health endpoint for container healthcheck
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Always fetch latest index.html so new JS bundle hashes are picked up after deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Streaming SSH scans — 30 min idle timeout (resets on each progress chunk)
    location = /api/file-monitor/fetch {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Streaming outage impact calculation
    location = /api/outage/impact {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # API proxy — LB/SSO email header is forwarded automatically when set upstream.
    # Configure Admin → Config: infra.ssoEnabled=true, infra.ssoEmailHeader=X-Forwarded-Email
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket proxy
    location /socket.io/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
