version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wfm-controlm-api
    restart: unless-stopped
    ports:
      - "4005:4005"
    environment:
      PORT: "4005"
    env_file:
      - .env
    # Bootstrap vars only in .env (DATABASE_URL, CONFIG_ENCRYPTION_KEY, Keeper paths).
    # SMTP, port, DB2 paths, etc. → AppConfig in the DB (Admin → Config).
    volumes:
      - backend_logs:/app/logs
      - ./lib:/app/lib:ro

  # Frontend (Nginx serving React build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wfm-controlm-ui
    restart: unless-stopped
    ports:
      - "3005:80"
    depends_on:
      - backend

volumes:
  backend_logs:
