# Optional local SMTP catcher — NOT for production (use real relay via Admin → Config).
#
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.mailpit.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.mailpit.yml up -d
#
# Web UI: http://localhost:8025   SMTP: localhost:1025
#
# Point AppConfig secrets.smtpHost to host.docker.internal (Docker Desktop / WSL)
# or your Docker host IP on Linux. Port secrets.smtpPort = 1025.

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: wfm-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
